name: Polycom
description: >-
  Polycom, Inc. was a pioneer of unified communications and video conferencing,
  known for its RealPresence video collaboration platform, SoundStation
  conference phones, and Group Series and HDX room video endpoints. Polycom
  merged with Plantronics in 2018 to form Poly, which HP acquired in 2022; the
  polycom.com domain now redirects to HP's Poly product line. For developers,
  Polycom exposed the RealPresence Platform REST API (via the RealPresence
  Resource Manager and Distributed Media Application, later branded Clariti)
  along with device REST APIs on its VideoOS endpoints, enabling programmatic
  conference control, scheduling, provisioning, resource monitoring, and billing
  integration. Developer resources are now consolidated under HP's Poly
  developer portal.
